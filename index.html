<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!--seo:start-->
    <title>Kairn · Création web & génération de leads</title>
    <meta name="description" content="Kairn conçoit vos landing pages, lance vos campagnes Meta et Google Ads et construit votre CRM sur mesure pour suivre chaque lead jusqu’à la vente." />
    <!--seo:end-->
    <meta name="theme-color" content="#0B0918" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Inter Tight : police de l'accueil depuis la mise en ligne du 29/10/2026 -->
    <link id="font-inter-tight" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      /* Barre de chargement d'une page (App.jsx, Chargement) : visible seulement si l'attente dépasse 150 ms. */
      .page-loading { position: fixed; z-index: 9999; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; pointer-events: none; animation: pl-in 0s 150ms both; }
      .page-loading span { position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, #0EA5E9, #4F46E5); animation: pl-run 1s ease-in-out infinite; }
      @keyframes pl-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pl-run { from { left: -40%; } to { left: 100%; } }
      body {
        font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #FAFAFA;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--seo:noscript-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
